<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Capstone Property — Creatives</title>
<style>
body{font-family:-apple-system,'Segoe UI',Arial,sans-serif;background:#F4F5F7;color:#1a1d21;margin:0;padding:48px 20px}
main{max-width:560px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
p{color:#6b7280;font-size:14px;margin:0 0 28px}
a.card{display:block;background:#fff;border:1px solid #e2e5ea;border-radius:10px;padding:18px 20px;margin-bottom:12px;
  text-decoration:none;color:inherit;box-shadow:0 1px 3px rgba(0,0,0,.05)}
a.card b{display:block;font-size:16px;margin-bottom:2px}
a.card span{color:#6b7280;font-size:13px}
a.card em.sold{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:#A31D57;border:1px solid currentColor;border-radius:4px;padding:2px 7px;margin-left:10px;vertical-align:2px}
a.card.is-sold{opacity:.62}
.theme-btn{position:fixed;top:16px;right:18px;font-size:15px;background:transparent;color:inherit;
  border:1px solid #C9CFD7;border-radius:6px;padding:4px 9px;cursor:pointer}
html[data-theme="dark"] body{background:#14181D;color:#E8ECF1}
html[data-theme="dark"] a.card{background:#1F252C;border-color:#333C46;box-shadow:0 1px 3px rgba(0,0,0,.4)}
html[data-theme="dark"] a.card span, html[data-theme="dark"] p{color:#8B96A1}
html[data-theme="dark"] .theme-btn{border-color:#333C46}
</style></head><body>
<button class="theme-btn" id="themeBtn" title="Toggle dark mode">&#9680;</button>
<main>
<h1>Creatives</h1>
<p>Capstone Property — internal review links.</p>
<a class="card" data-dir="bliss" href="bliss/"><b>Bliss Villas<em class="sold" hidden>Sold out</em></b><span>Brochure · 4 photo ads · 1 reel · 31-photo gallery</span></a>
<a class="card" data-dir="ocean" href="ocean/"><b>The Ocean Residences<em class="sold" hidden>Sold out</em></b><span>Brochure · 17 photo ads (EN + AR) · 2 launch films · 40-photo gallery</span></a>
</main>
<script>
(function(){
  const btn=document.getElementById('themeBtn');
  const get=()=>{try{return localStorage.getItem('deck-theme')}catch(e){return null}};
  const store=v=>{try{localStorage.setItem('deck-theme',v)}catch(e){}};
  const apply=v=>{document.documentElement.dataset.theme=v;btn.textContent=v==='dark'?'\u2600':'\u25D0'};
  apply(get()||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
  btn.addEventListener('click',()=>{const v=document.documentElement.dataset.theme==='dark'?'light':'dark';apply(v);store(v)});
})();
// live status overrides (published from the deck admin panel)
fetch('status.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(st=>{
  if(!st) return;
  document.querySelectorAll('a.card[data-dir]').forEach(a=>{
    const v = st[a.dataset.dir] || 'live';
    a.style.display = v==='hidden' ? 'none' : '';
    a.classList.toggle('is-sold', v==='soldout');
    const em = a.querySelector('em.sold'); if(em) em.hidden = v!=='soldout';
  });
}).catch(()=>{});
</script>
</body></html>
